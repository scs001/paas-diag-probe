# Diagnostic probe — runs on GitHub runners whose network path to the
# production edge is independent of the operator's local route. Dispatch-only.
# The probe script lives at scripts/probe.mjs (checked in — no inline heredocs).
name: diag-probe
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Optional persona-candidate id to re-evaluate (skip create)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reachability (unauthenticated faces)
        run: |
          for u in \
            "https://platform.finddatatech.cloud/api/config" \
            "https://facet.finddatatech.cloud/api/mcp-catalog?locale=zh-CN"; do
            code=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "$u" || echo 000)
            echo "$u -> $code"
          done
      - name: Judge-lane probe (cookie secret)
        env:
          PAAS_COOKIE: ${{ secrets.PAAS_SESSION_COOKIE }}
        run: node scripts/probe.mjs "${{ inputs.candidate_id }}"
